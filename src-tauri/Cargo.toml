[package]
name = "xrl-router"
version = "0.1.0"
description = "Multi-Provider AI LLM API Routing Gateway"
authors = ["xrl"]
edition = "2021"
default-run = "xrl-router"

[lib]
name = "xrl_router_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri（透明窗口：Windows 走 WebviewWindowBuilder::transparent；macOS WKWebView 默认透明，
# 该 API 在 macOS 上未暴露，须 cfg 隔离——见 src/wallpaper/mod.rs create_window）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# 双栈监听需显式设置 IPV6_V6ONLY（tokio TcpSocket 不暴露该方法）
socket2 = "0.6"
# SPA fallback / 静态资源：编译期嵌入 dist，消除生产环境的路径解析问题
include_dir = "0.7"

# HTTP framework
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
bytes = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
base64 = "0.22"
rand = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"

# Utilities
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dashmap = "6"
tokio-stream = { version = "0.1", features = ["sync"] }
scraper = "0.20"
url = "2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-notification = "2"

# Audio playback
rodio = "0.20"

# llama.cpp 预编译二进制解压（本地模型引擎；macOS/Linux 为 .tar.gz，Windows 为 .zip）
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

# System media controls (macOS Now Playing / Windows SMTC / Linux MPRIS)
souvlaki = "0.8"

# MCP 工具服务器（/mcp Streamable HTTP 端点，对外提供 web_search / web_fetch）
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server"] }

# WebFetch 页面渲染：Tauri 内置 WebView（macOS WKWebView / Windows WebView2 / Linux WebKitGTK），
# 无额外浏览器依赖（见 docs/DECISIONS.md ADR-038）

# 渲染后的 HTML → Markdown（喂给模型前压缩体积、保留结构）
htmd = "0.2"

# 桌面壁纸劫持（FM 像素艺术 → 桌面层）：
# - Windows：透明 WebView 窗口 + 自实现 WorkerW 挂载（配方同社区插件
#   tauri-plugin-desktop-underlay + Z 序锚定，见 docs/DECISIONS.md ADR-043/049）

# 系统资源监控（CPU/内存/显存占用）
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# block 0.1.6（souvlaki → cocoa 的 macOS 传递依赖）触发 future-incompat lint
# uninhabited-static（rust-lang/rust#74840），上游 2016 年后无新版，故 vendor 打补丁。
# 详见 vendor/block/README.md 说明。
[patch.crates-io]
block = { path = "vendor/block" }
