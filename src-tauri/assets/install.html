<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XRL Router · 客户分发 / Client Deploy</title>
<style>
  :root {
    --bg: #fef7ff; --on-bg: #1d1b20; --surface: #fef7ff; --surface-h: #ece6f0;
    --on-surface-var: #49454f; --outline-var: #cac4d0; --primary: #6750a4;
    --error: #b3261e; --on-primary: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141218; --on-bg: #e6e0e9; --surface: #141218; --surface-h: #2b2930;
      --on-surface-var: #cac4d0; --outline-var: #49454f; --primary: #d0bcff;
      --error: #f2b8b5; --on-primary: #381e72;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Roboto Flex', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--on-bg); min-height: 100vh; padding: 32px 16px 64px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .subtitle { color: var(--on-surface-var); margin: 0 0 24px; font-size: 0.9rem; }
  .card { background: var(--surface); border-radius: 16px; padding: 20px; margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  .label { font-size: 0.78rem; color: var(--on-surface-var); margin: 0 0 6px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .08em; }
  .cmd-box { background: var(--surface-h); border-radius: 12px; padding: 14px 14px; font-family:
    'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; white-space:
    pre-wrap; word-break: break-all; line-height: 1.5; margin: 0; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 9999px;
    padding: 8px 18px; font-size: 0.85rem; font-weight: 500; cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--primary); color: var(--on-primary); }
  .btn-outlined { background: transparent; color: var(--primary); outline: 1px solid var(--outline-var); }
  .checks { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 4px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
  .seg { display: inline-flex; background: var(--surface-h); border-radius: 9999px; padding: 3px; gap: 2px; }
  .seg button { background: transparent; color: var(--on-surface-var); padding: 6px 14px; font-size: 0.82rem; }
  .seg button.active { background: var(--primary); color: var(--on-primary); }
  .lang-switch { position: fixed; top: 16px; right: 16px; z-index: 10; }
  .warn { color: var(--error); font-size: 0.8rem; margin: 8px 0 0; }
  .muted { color: var(--on-surface-var); font-size: 0.82rem; }
  .copy-ok { color: var(--primary); font-size: 0.8rem; opacity: 0; transition: opacity .2s; }
  .copy-ok.show { opacity: 1; }
  .placeholder { text-align: center; color: var(--on-surface-var); padding: 48px 16px; }
  code { background: var(--surface-h); padding: 1px 6px; border-radius: 4px; font-family: 'Roboto Mono', monospace; }
  select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--outline-var);
    background: var(--surface); color: var(--on-bg); font-size: 0.88rem; font-family: inherit;
    min-width: 220px; }
  .model-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .err { color: var(--error); font-size: 0.82rem; margin: 8px 0 0; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--outline-var);
    border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="lang-switch seg">
  <button id="lang-zh" class="active" onclick="setLang('zh')">中文</button>
  <button id="lang-en" onclick="setLang('en')">English</button>
</div>
<div class="wrap" id="app"></div>
<script>
(function () {
  // ── 内联 i18n（纯静态页自包含，无构建依赖） ──
  var I18N = {
    zh: {
      title: '客户分发',
      subtitle: '网关地址：<code>{base}</code> · 密钥已嵌入命令',
      no_key_title: '未携带密钥',
      no_key_desc: '请从主机的 XRL Router 密钥管理页「创建密钥」，复制弹出的「分发链接」打开此页面。',
      models_fetch_error: '拉取模型失败：{msg}',
      cli_installed_note: '已勾选「已安装 Claude Code CLI」，命令省略安装段。',
      cli_install_note: '命令将先安装 Claude Code CLI（需 Node.js ≥ 22），再写入配置。',
      models_loading: '正在拉取网关可用模型…',
      models_error_ignore: '可忽略，命令将不写默认模型（Claude Code 会用其默认模型名，若网关无对应别名将 404）。',
      no_models: '网关暂无可用模型。请先在主机 XRL Router 配置供应商与模型。',
      models_hint: '网关模型别名（写入 ANTHROPIC_DEFAULT_*_MODEL_NAME 与 CLAUDE_CODE_SUBAGENT_MODEL，Claude Code 实际请求此别名；官方 ID 对应槽位固定）',
      cli_installed: '我已安装 Claude Code CLI',
      default_model: '默认模型',
      copy_cmd: '{platform} · 请复制以下命令',
      verify: '安装后验证',
      verify_desc: '在终端运行 <code>claude --version</code> 确认 CLI 可用；运行 <code>claude</code> 发消息，请求会经本机网关（主机 XRL Router 统计页可见流量）。',
      key_warning: '⚠ 密钥已明文嵌入命令，请勿公开分享。',
    },
    en: {
      title: 'Client Deploy',
      subtitle: 'Gateway: <code>{base}</code> · key embedded in command',
      no_key_title: 'No key provided',
      no_key_desc: 'Create a key in the XRL Router key management page on the host, then open the "deploy link" from the popup.',
      models_fetch_error: 'Failed to fetch models: {msg}',
      cli_installed_note: 'Checked "Claude Code CLI installed" — install step omitted.',
      cli_install_note: 'The command will install Claude Code CLI first (Node.js ≥ 22 required), then write the config.',
      models_loading: 'Fetching gateway models…',
      models_error_ignore: 'You can ignore this — the command will skip default models (Claude Code uses its own defaults; missing aliases may 404).',
      no_models: 'No models available on the gateway. Configure providers and models on the host XRL Router first.',
      models_hint: 'Gateway model aliases (written to ANTHROPIC_DEFAULT_*_MODEL_NAME and CLAUDE_CODE_SUBAGENT_MODEL; Claude Code requests these aliases, official IDs are fixed per slot)',
      cli_installed: 'I have Claude Code CLI installed',
      default_model: 'Default Model',
      copy_cmd: '{platform} · copy the command below',
      verify: 'Verify after install',
      verify_desc: 'Run <code>claude --version</code> in a terminal to confirm the CLI works; run <code>claude</code> and send a message — traffic will flow through the local gateway (visible in the host XRL Router stats page).',
      key_warning: '⚠ The key is embedded in plaintext in the command. Do not share publicly.',
    },
  };

  var lang = 'zh';
  var params = new URLSearchParams(location.search);
  var urlLang = params.get('lang');
  var saved = null;
  try { saved = localStorage.getItem('install-lang'); } catch (e) {}
  if (urlLang === 'zh' || urlLang === 'en') {
    lang = urlLang;
  } else if (saved === 'zh' || saved === 'en') {
    lang = saved;
  } else {
    lang = (navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'zh';
  }

  function tr(key, vars) {
    var text = (I18N[lang] && I18N[lang][key]) || I18N.zh[key] || key;
    if (vars) {
      for (var k in vars) {
        text = text.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
      }
    }
    return text;
  }

  // 语言切换（按钮在 <script> 前定义，window 上暴露）
  window.setLang = function (l) {
    lang = l;
    try { localStorage.setItem('install-lang', l); } catch (e) {}
    var zhBtn = document.getElementById('lang-zh');
    var enBtn = document.getElementById('lang-en');
    zhBtn.className = l === 'zh' ? 'active' : '';
    enBtn.className = l === 'en' ? 'active' : '';
    document.documentElement.lang = l === 'en' ? 'en' : 'zh-CN';
    render();
    fetchModels();
  };
  // 初始化按钮高亮
  setTimeout(function () {
    var zhBtn = document.getElementById('lang-zh');
    var enBtn = document.getElementById('lang-en');
    if (zhBtn && enBtn) {
      zhBtn.className = lang === 'zh' ? 'active' : '';
      enBtn.className = lang === 'en' ? 'active' : '';
    }
  }, 0);

  var app = document.getElementById('app');
  var key = params.get('t') || '';
  var base = location.origin; // http://<本机IP>:19068

  if (!key) {
    app.innerHTML =
      '<div class="card placeholder">' +
      '<p style="font-size:1.1rem;margin:0 0 8px">' + tr('no_key_title') + '</p>' +
      '<p class="muted" style="margin:0">' + tr('no_key_desc') + '</p>' +
      '</div>';
    return;
  }

  var ua = navigator.userAgent || '';
  var isWin = /Windows/i.test(ua) || /Win32|Win64/.test(navigator.platform || '');
  var detected = isWin ? 'win' : 'unix';

  var state = {
    platform: detected,
    cli: false,
    copied: '',
    models: [],          // [{id, owned_by, tier}]
    model: '',          // 选中的别名
    modelsLoading: true,
    modelsError: ''
  };

  // 拉取网关可用模型别名（用 URL 里的 key 鉴权，同源 19068 无 CORS 问题）
  function fetchModels() {
    state.modelsLoading = true;
    state.modelsError = '';
    fetch(base + '/v1/models', { headers: { 'x-api-key': key } })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        var list = (data && data.data) || [];
        state.models = list.map(function (m) {
          return { id: m.id, owned_by: m.owned_by || '', tier: m.tier || '' };
        });
        if (state.models.length) {
          // 默认选 tier 最靠前的（后端按 tier, display_name 排序，第一项通常是主模型）
          state.model = state.models[0].id;
        }
        state.modelsLoading = false;
        render();
      })
      .catch(function (e) {
        state.modelsLoading = false;
        state.modelsError = tr('models_fetch_error', { msg: e && e.message ? e.message : e });
        render();
      });
  }

  // Claude Code 模型槽位：_MODEL 与 _MODEL_NAME 统一设为网关别名（= display_name）。
  // 不写官方 ID——Claude Code 无论发 _MODEL 还是 _MODEL_NAME 的值，都能命中网关别名，
  // 避免官方 ID 在网关模型表里查不到而 404。
  var SLOTS = [
    { slot: 'FABLE' },
    { slot: 'HAIKU' },
    { slot: 'OPUS' },
    { slot: 'SONNET' }
  ];

  // 生成 env 模型行（无选中别名 → 空，命令只写 base/token，避免 404 别名）。
  // 值用单引号包裹：bash 里整个脚本包在 node -e "..." 双引号中，双引号值会截断外层。
  function envModelLines() {
    if (!state.model) return '';
    var lines = SLOTS.map(function (s) {
      return 'ANTHROPIC_DEFAULT_' + s.slot + '_MODEL=' + q(state.model) +
        '|ANTHROPIC_DEFAULT_' + s.slot + '_MODEL_NAME=' + q(state.model);
    }).join('|');
    return lines + '|CLAUDE_CODE_SUBAGENT_MODEL=' + q(state.model);
  }
  function q(v) { return '\'' + v + '\''; }

  // 顶层安全配置行（非 env 块）：permissions.defaultMode + skip*（合并保留既有）
  function topLevelLines() {
    return 'permissions.defaultMode=bypassPermissions|skipDangerousModePermissionPrompt=true|skipWebFetchPreflight=true';
  }

  function psWriteSettings() {
    // B 段：写 %USERPROFILE%\.claude\settings.json，合并 env 与顶层配置，保留既有字段
    var envLines = envModelLines();
    var parts = [
      '$p="$env:USERPROFILE\\.claude\\settings.json"',
      'New-Item -ItemType Directory -Force "$env:USERPROFILE\\.claude" | Out-Null',
      '$j=@{}; if(Test-Path $p){ $j=Get-Content $p -Raw | ConvertFrom-Json }',
      'if(-not $j.env){ $j.env=@{} }',
      '$j.env.ANTHROPIC_AUTH_TOKEN=\'' + key + '\'',
      '$j.env.ANTHROPIC_BASE_URL=\'' + base + '\''
    ];
    if (envLines) {
      envLines.split('|').forEach(function (line) {
        var kv = line.split('=');
        var k = kv[0], v = kv.slice(1).join('=');
        parts.push('$j.env.' + k + '=' + v);
      });
    }
    // 顶层安全配置（合并，不覆盖用户既有 permissions 其他键）
    parts.push('if(-not $j.permissions){ $j.permissions=@{} }');
    parts.push('$j.permissions.defaultMode=\'bypassPermissions\'');
    parts.push('$j.skipDangerousModePermissionPrompt=$true');
    parts.push('$j.skipWebFetchPreflight=$true');
    parts.push('$j | ConvertTo-Json -Depth 10 | Set-Content $p');
    return parts.join('; ');
  }
  function bashWriteSettings() {
    // B 段：用 node 合并 ~/.claude/settings.json，保留既有字段
    var envLines = envModelLines();
    var s = 'const fs=require(\'fs\'),p=process.env.HOME+\'/.claude/settings.json\';' +
      'let j={};try{j=JSON.parse(fs.readFileSync(p))}catch{};' +
      'j.env=j.env||{};' +
      'j.env.ANTHROPIC_AUTH_TOKEN=' + q(key) + ';' +
      'j.env.ANTHROPIC_BASE_URL=' + q(base) + ';';
    if (envLines) {
      envLines.split('|').forEach(function (line) {
        var kv = line.split('=');
        var k = kv[0], v = kv.slice(1).join('=');
        s += 'j.env.' + k + '=' + v + ';';
      });
    }
    s += 'j.permissions=j.permissions||{};j.permissions.defaultMode=\'bypassPermissions\';' +
      'j.skipDangerousModePermissionPrompt=true;j.skipWebFetchPreflight=true;' +
      'fs.writeFileSync(p,JSON.stringify(j,null,2))';
    return 'mkdir -p ~/.claude && node -e "' + s + '"';
  }

  function buildCommand() {
    var writeSettings = state.platform === 'win' ? psWriteSettings() : bashWriteSettings();
    var installCli = 'npm i -g @anthropic-ai/claude-code';
    var sep = state.platform === 'win' ? '; ' : ' && ';
    if (state.cli) {
      return writeSettings;
    }
    return installCli + sep + writeSettings;
  }

  function render() {
    var cmd = buildCommand();
    var platformLabel = state.platform === 'win' ? 'Windows (PowerShell)' : 'macOS / Linux (Bash)';
    var cliNote = state.cli
      ? '<p class="muted">' + tr('cli_installed_note') + '</p>'
      : '<p class="muted">' + tr('cli_install_note') + '</p>';

    var modelBlock;
    if (state.modelsLoading) {
      modelBlock = '<div class="model-row"><span class="spinner"></span><span class="muted">' + tr('models_loading') + '</span></div>';
    } else if (state.modelsError) {
      modelBlock = '<p class="err">' + escapeHtml(state.modelsError) + '</p>' +
        '<p class="muted">' + tr('models_error_ignore') + '</p>';
    } else if (!state.models.length) {
      modelBlock = '<p class="muted">' + tr('no_models') + '</p>';
    } else {
      var opts = state.models.map(function (m) {
        var label = m.id + (m.owned_by ? ' · ' + m.owned_by : '');
        return '<option value="' + escapeAttr(m.id) + '"' + (m.id === state.model ? ' selected' : '') + '>' +
          escapeHtml(label) + '</option>';
      }).join('');
      modelBlock =
        '<div class="model-row">' +
          '<span class="muted">' + tr('models_hint') + '</span>' +
        '</div>' +
        '<div class="model-row"><select id="model-sel">' + opts + '</select></div>';
    }

    app.innerHTML =
      '<h1>' + tr('title') + '</h1>' +
      '<p class="subtitle">' + tr('subtitle', { base: escapeHtml(base) }) + '</p>' +
      '<div class="card">' +
        '<div class="seg">' +
          '<button id="seg-win" class="' + (state.platform === 'win' ? 'active' : '') + '">Windows</button>' +
          '<button id="seg-unix" class="' + (state.platform === 'unix' ? 'active' : '') + '">macOS / Linux</button>' +
        '</div>' +
        '<div class="checks">' +
          '<label class="check"><input type="checkbox" id="chk-cli"' + (state.cli ? ' checked' : '') + '> ' + tr('cli_installed') + '</label>' +
        '</div>' +
        cliNote +
      '</div>' +
      '<div class="card">' +
        '<p class="label">' + tr('default_model') + '</p>' +
        modelBlock +
      '</div>' +
      '<div class="card">' +
        '<p class="label">' + tr('copy_cmd', { platform: platformLabel }) + '</p>' +
        '<pre class="cmd-box" id="cmd">' + escapeHtml(cmd) + '</pre>' +
      '</div>' +
      '<div class="card">' +
        '<p class="label">' + tr('verify') + '</p>' +
        '<p class="muted" style="margin:0">' + tr('verify_desc') + '</p>' +
      '</div>' +
      '<p class="warn">' + tr('key_warning') + '</p>';

    document.getElementById('seg-win').onclick = function () { state.platform = 'win'; render(); };
    document.getElementById('seg-unix').onclick = function () { state.platform = 'unix'; render(); };
    var chk = document.getElementById('chk-cli');
    if (chk) chk.onchange = function (e) { state.cli = e.target.checked; render(); };
    var sel = document.getElementById('model-sel');
    if (sel) sel.onchange = function (e) { state.model = e.target.value; render(); };
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escapeAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  render();
  fetchModels();
})();
</script>
</body>
</html>
